<!DOCTYPE html>
<html lang="en">
{% include sheet-head.html %}
<body class="sheet-page doc-page">
{% include sheet-bar.html %}
<main id="content" class="doc doc-wide">
  <header class="doc-head"><h1>{{ page.title | default: "All posts" }}</h1></header>
  <div class="entries">
    {% for post in site.posts %}{% if post.title != 404 %}
      {% include sheet-entry.html post=post %}
    {% endif %}{% endfor %}
  </div>
</main>
{% include sheet-foot.html %}
</body>
</html>
