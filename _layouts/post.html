<!DOCTYPE html>
<html lang="en">
{% include sheet-head.html %}
<body class="sheet-page doc-page">
{% include sheet-bar.html %}
<main id="content" class="doc">
  <article>
    <header class="doc-head">
      <h1>{{ page.title }}</h1>
      {% if page.description and page.layout == 'post' and page.category %}<p class="doc-meta">{{ page.description }}</p>{% endif %}
    </header>
    {% if page.image and page.image_show_on_page != false %}<figure class="doc-hero"><img src="{{ page.image | relative_url }}" alt=""></figure>{% endif %}
    <div class="prose">
      {{ content }}
    </div>
  </article>
</main>
{% include sheet-foot.html %}
</body>
</html>
