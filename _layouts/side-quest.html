<!DOCTYPE html>
<html lang="en">
{% include sheet-head.html %}
<body class="sheet-page doc-page sq-page">
{% include sheet-bar.html %}
<style>
  .sq-sheet { flex: 1; padding: var(--gutter); }
  .sq-sheet .neatline { min-height: calc(100vh - 12rem); display: grid; place-items: center; padding: clamp(3rem, 7vw, 5rem) 1rem; }
  #sq-card { position: relative; z-index: 2; width: min(36rem, 100%); background: var(--paper); border: 1.5px solid var(--rule); padding: clamp(1.4rem, 3vw, 2.2rem); animation: sq-in .45s var(--ease) both; }
  @keyframes sq-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .sq-top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; border-bottom: 1px solid var(--rule-soft); padding-bottom: .8rem; }
  .sq-top h1 { font-size: clamp(2rem, 4vw, 2.8rem); }
  .sq-diff-wrap { display: flex; align-items: center; gap: .5rem; font: 600 .74rem/1 var(--cond); letter-spacing: .16em; text-transform: uppercase; color: var(--wine); }
  #sq-diff { display: flex; gap: .3rem; }
  #sq-diff span { width: 11px; height: 11px; transform: rotate(45deg); border: 1.75px solid var(--wine); }
  #sq-diff span.lit { background: var(--wine); }
  .sq-more { margin: 1.1rem 0 0; font: italic 400 .98rem/1.45 var(--serif); color: var(--ink-2); }
  .sq-more a { color: var(--wine-deep); text-decoration-color: rgba(138, 42, 61, .45); text-underline-offset: .18em; }
  .sq-more a:hover { color: var(--wine); text-decoration-color: var(--wine); }
  #sq-category { margin-top: 1.2rem; font: 600 .82rem/1.3 var(--cond); letter-spacing: .18em; text-transform: uppercase; color: var(--wine-deep); }
  #sq-emoji { display: block; font-size: 2.6rem; line-height: 1; margin-top: .8rem; }
  #sq-quest { margin: .9rem 0 0; font: 400 clamp(1.3rem, 2.4vw, 1.6rem)/1.35 var(--serif); color: var(--ink); text-wrap: pretty; }
  #sq-flavour { margin: .8rem 0 0; font: italic 400 1.05rem/1.5 var(--serif); color: var(--ink-2); }
  #sq-reroll { margin-top: 1.6rem; font: 600 1rem/1 var(--sans); background: var(--wine); color: var(--paper); border: 0; padding: .85rem 1.3rem; cursor: pointer; transition: background .25s var(--ease); }
  #sq-reroll:hover { background: var(--wine-deep); }
  @media (prefers-reduced-motion: reduce) { #sq-card { animation: none; } }
</style>
<main id="content" class="sq-sheet">
  <div class="neatline">
    <div class="ticks ticks-x" aria-hidden="true"><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span></div>
    <div class="ticks ticks-y" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></div>
    <section id="sq-card" aria-live="polite">
      <div class="sq-top">
        <h1>Side quest</h1>
        <div class="sq-diff-wrap">Difficulty <div id="sq-diff" aria-hidden="true"></div></div>
      </div>
      <p id="sq-category"></p>
      <span id="sq-emoji" aria-hidden="true"></span>
      <h2 id="sq-quest"></h2>
      <p id="sq-flavour"></p>
      <button id="sq-reroll" type="button">Roll a new quest</button>
      <p class="sq-more">Need a first line? <a href="{{ '/icebreaker/' | relative_url }}">Try the Icebreaker cards</a>.</p>
    </section>
  </div>
</main>
{% include sheet-foot.html %}
<script>
var QUESTS = [
  // ── Social / tiny risks ──────────────────────────────────────────────────
  { emoji:'💬', cat:'Social', diff:1, quest:'Compliment a stranger on something specific — their jacket, their dog, their laugh.', flavour:'Make it genuine, not generic. "Nice shoes" is fine. "That colour looks great on you" lands differently.' },
  { emoji:'🙋', cat:'Social', diff:1, quest:'Strike up a conversation with someone waiting in the same queue as you.', flavour:'Comment on the wait, the weather, anything. You only need one sentence to get it started.' },
  { emoji:'☕', cat:'Social', diff:1, quest:'Ask the barista how their day is actually going — and listen to the answer.', flavour:'They\'re trained to ask you. Flip it. Most people light up when someone asks them first.' },
  { emoji:'📞', cat:'Social', diff:1, quest:'Call (not text) someone you haven\'t spoken to in over a year.', flavour:'No agenda. Just "hey, I was thinking about you." That\'s the whole script.' },
  { emoji:'😄', cat:'Social', diff:1, quest:'Make eye contact and smile at five strangers today. Count them.', flavour:'It\'s small, it\'s free, and it shifts the whole energy of your day.' },
  { emoji:'✉️', cat:'Social', diff:1, quest:'Send a voice note to a friend instead of a text message.', flavour:'Voice notes feel more human. Your tone, your laugh — they\'re all in there.' },
  { emoji:'🤝', cat:'Social', diff:2, quest:'Introduce yourself to a neighbour you\'ve never properly met.', flavour:'You share a wall/hallway/street. You might as well know each other\'s names.' },
  { emoji:'🎂', cat:'Social', diff:1, quest:'Text someone "thinking of you" today — no reason, no context, just that.', flavour:'It takes 5 seconds to send and will probably make their whole afternoon.' },
  { emoji:'🫂', cat:'Social', diff:2, quest:'Tell someone in your life something you appreciate about them — out loud, not over text.', flavour:'Pick one thing, be specific. "I really appreciate how you always..." is a full sentence.' },
  { emoji:'👥', cat:'Social', diff:2, quest:'Invite yourself to something. Ask a friend what they\'re doing this weekend and just join.', flavour:'People rarely say no when you ask directly. The awkward part only exists in your head.' },
  { emoji:'🗣️', cat:'Social', diff:2, quest:'Start a conversation with someone at a café, gym, or park who\'s alone and looks approachable.', flavour:'One line is all you need. The rest follows if it\'s meant to.' },
  { emoji:'🧑‍🍳', cat:'Social', diff:2, quest:'Cook something and drop it off for a friend or colleague unexpectedly.', flavour:'Food is one of the oldest ways humans say "I care about you." Use it.' },
  { emoji:'💌', cat:'Social', diff:1, quest:'Write a genuine thank-you message to someone who helped you this year — even for something small.', flavour:'People do things and never hear back. Close that loop.' },
  { emoji:'🎤', cat:'Social', diff:3, quest:'Share an opinion you\'d normally keep to yourself in a group conversation.', flavour:'Not aggressively — just honestly. Saying what you actually think is a skill that needs practice.' },
  { emoji:'🆕', cat:'Social', diff:3, quest:'Find something happening in your city tonight — a gig, quiz night, open mic — and go alone.', flavour:'Arrive, get a drink, and find one person to talk to. That\'s the only goal. Everything else is a bonus.' },
  { emoji:'🙏', cat:'Social', diff:2, quest:'Apologise to someone you\'ve been meaning to, but kept putting off.', flavour:'It doesn\'t have to be big. "Hey, I was a bit short with you last time — sorry about that." Done.' },
  { emoji:'💡', cat:'Social', diff:2, quest:'Ask someone older than you for advice on something you\'re genuinely figuring out.', flavour:'People with experience love to share it. You get wisdom; they feel valued. Win-win.' },
  { emoji:'🎁', cat:'Social', diff:1, quest:'Buy a small gift for someone with no occasion whatsoever.', flavour:'A book they\'d like, a chocolate bar, a postcard. The randomness is the point.' },
  { emoji:'📖', cat:'Social', diff:1, quest:'Recommend a book, film, or album to someone and tell them exactly why you loved it.', flavour:'Sharing something you love is a form of vulnerability. It\'s also how people bond.' },
  { emoji:'👋', cat:'Social', diff:1, quest:'Learn the name of someone you see regularly but have never properly introduced yourself to.', flavour:'The delivery person, the security guard, the person at the corner shop. Names matter.' },
  { emoji:'🌍', cat:'Social', diff:2, quest:'Ask someone from a different country or culture to teach you one thing about where they\'re from.', flavour:'A dish, a tradition, a word. People love sharing their culture when asked with genuine curiosity.' },
  { emoji:'🎯', cat:'Social', diff:3, quest:'Share something personal in a conversation today — something you\'d normally keep to yourself.', flavour:'Vulnerability isn\'t weakness. It\'s how people actually connect past the surface level.' },
  { emoji:'🧩', cat:'Social', diff:2, quest:'Organise something small — a walk, a dinner, a movie night — and just send the invite without overthinking it.', flavour:'Stop waiting for someone else to plan it. You be the person who makes things happen.' },
  { emoji:'🤲', cat:'Social', diff:1, quest:'Help someone with something today without being asked and without expecting anything back.', flavour:'Hold the door longer. Carry something. Google something for someone. Just quietly do it.' },
  // ── Adventure / small risks ──────────────────────────────────────────────
  { emoji:'🚌', cat:'Adventure', diff:2, quest:'Get on a bus you\'ve never taken, ride to the end of the line, and explore for an hour.', flavour:'No map, no plan. Just go and figure it out when you get there.' },
  { emoji:'🌅', cat:'Adventure', diff:1, quest:'Go outside today and watch the sunset from wherever you are — no phone for the last 5 minutes of it.', flavour:'You\'ve walked past a hundred sunsets while looking at a screen. This one you actually watch.' },
  { emoji:'🍽️', cat:'Adventure', diff:1, quest:'Walk into a restaurant you\'ve never tried, sit at the bar if there is one, and order whatever the chef recommends.', flavour:'Take the option off your plate. Let someone else decide for once.' },
  { emoji:'🎭', cat:'Adventure', diff:3, quest:'Go to a live event — music, comedy, theatre — alone and fully commit to enjoying it.', flavour:'Solo nights out are underrated. You pay attention differently when there\'s no one to perform for.' },
  { emoji:'🏊', cat:'Adventure', diff:3, quest:'Find an open-water spot and get in, even if it\'s cold.', flavour:'Cold water swimming is the fastest legal way to feel fully alive. Just do it.' },
  { emoji:'📸', cat:'Creative', diff:1, quest:'Spend 30 minutes photographing your neighbourhood like a tourist seeing it for the first time.', flavour:'You stop noticing what\'s around you. This forces you to look again.' },
  { emoji:'🌿', cat:'Slow Living', diff:1, quest:'Find a park bench, sit for 20 minutes, and do nothing — no phone, no podcast.', flavour:'Doing nothing is a skill. And your nervous system is craving it.' },
  { emoji:'🚴', cat:'Adventure', diff:2, quest:'Rent a bike and go somewhere you\'ve only ever passed by in a car or on public transport.', flavour:'Everything is slower and better from a bike. Take the long way back.' },
  { emoji:'🧗', cat:'Adventure', diff:3, quest:'Find a climbing gym, martial arts studio, or rowing club near you and walk in today — most offer same-day trial sessions.', flavour:'Don\'t book in advance or you\'ll overthink it. Just show up and say "can I try a session today?"' },
  { emoji:'🌮', cat:'Slow Living', diff:1, quest:'Cook a dish from a country you\'ve never visited, from scratch.', flavour:'Bonus if the recipe is in another language and you have to translate it.' },
  { emoji:'🔭', cat:'Slow Living', diff:1, quest:'Go somewhere dark tonight and stargaze for 20 minutes without your phone.', flavour:'Let your eyes adjust for 10 minutes first. You\'ll be shocked by what you see.' },
  // ── Courage / small steps past social anxiety ────────────────────────────
  { emoji:"🧭", cat:'Courage', diff:1, quest:"Ask a stranger for directions to a place you already know how to get to.", flavour:"The stakes are zero: you already know the way. You are only practising the asking." },
  { emoji:"🛒", cat:'Courage', diff:1, quest:"Ask a shop assistant a question you could have answered yourself: where something is, or what they would pick.", flavour:"Small, structured asks with a built-in ending are the easiest reps there are." },
  { emoji:"📊", cat:'Courage', diff:1, quest:"Before your next social plan, write down what you think will go wrong and how bad it will be, out of 100. Afterwards, write what actually happened.", flavour:"Anxiety is a forecaster with a terrible track record. Start keeping its score." },
  { emoji:"🛡️", cat:'Courage', diff:2, quest:"Drop one safety habit for a whole conversation: no rehearsed lines, no phone in your hand, no eyes on the floor.", flavour:"Safety habits feel like protection, but they keep the fear alive. See what happens without the shield." },
  { emoji:"🔦", cat:'Courage', diff:1, quest:"In your next conversation, put all your attention on the other person (their words, their face, their story) instead of on how you are coming across.", flavour:"Self-focus feeds anxiety and curiosity starves it. It is hard to do both at once." },
  { emoji:"⏳", cat:'Courage', diff:2, quest:"Let a pause in a conversation sit for three full seconds before you rush to fill it.", flavour:"Silences feel ten times longer from the inside. Count them and you will see." },
  { emoji:"🙅", cat:'Courage', diff:2, quest:"Ask for something you expect to be refused: a small discount, the table by the window, an extra sample.", flavour:"Collect a no. Notice that you survive it, and that people are kinder about it than you feared." },
  { emoji:"🔑", cat:'Courage', diff:2, quest:"Drop your keys in a busy place, pick them up slowly, and count how many people actually look.", flavour:"The spotlight effect says everyone is watching. Test it. Almost nobody is." },
  { emoji:"✋", cat:'Courage', diff:3, quest:"Ask a question at a talk, a lecture or a meeting. Be the first to ask, if you can.", flavour:"Someone else in the room has the same question and is hoping somebody else asks it." },
  { emoji:"☎️", cat:'Courage', diff:1, quest:"Phone a shop or a restaurant with a question instead of looking it up online.", flavour:"Calls are scarier than they are hard. Thirty seconds, one question, done." },
  { emoji:"🧾", cat:'Courage', diff:2, quest:"Return or exchange something at a shop, even something small.", flavour:"You are allowed to want things to be right. Saying so politely is a skill, not a confrontation." },
  { emoji:"🍝", cat:'Courage', diff:3, quest:"Eat a meal alone at a restaurant table, with no phone and no book.", flavour:"Nobody is wondering why you are alone. They are thinking about their own lunch." },
  { emoji:"❓", cat:'Courage', diff:2, quest:"Say \"I don't follow, can you explain that?\" the next time you don't understand something, instead of nodding along.", flavour:"Pretending to understand is a safety habit too. Asking is what confident people actually do." },
  { emoji:"🫱", cat:'Courage', diff:3, quest:"Join a group conversation that is already going, with a simple \"Mind if I join you?\"", flavour:"Groups open up far more often than they close. The worst case is a short, polite chat." },
  { emoji:"🎲", cat:'Courage', diff:3, quest:"Go to a meetup for something you are curious about (a language exchange, a board-game night, a running club) and stay for at least 45 minutes.", flavour:"The first fifteen minutes are the hardest and the least representative. Stay past them." },
  { emoji:"📅", cat:'Courage', diff:3, quest:"Turn a casual chat into a plan: \"Want to grab a coffee? How's Thursday?\"", flavour:"Vague plans fade. A day and a time give them a heartbeat." },
  { emoji:"💭", cat:'Courage', diff:1, quest:"Message someone you would like to know better and ask a real question about something they said or shared.", flavour:"A specific question shows you were paying attention, and it is easy to answer." },
  { emoji:"👀", cat:'Courage', diff:1, quest:"Hold eye contact a little longer than feels comfortable, until the other person finishes their sentence.", flavour:"It feels intense to you and simply attentive to them." },
  { emoji:"🚪", cat:'Courage', diff:1, quest:"Be the first to say hello when you walk into a room, a lift or a meeting.", flavour:"Going first takes ten seconds and sets the temperature for everyone else." },
  { emoji:"🫣", cat:'Courage', diff:2, quest:"Tell someone you are nervous: \"Honestly, I'm a bit nervous about this.\" Notice how they respond.", flavour:"Naming it out loud usually shrinks it, and it invites the other person to be human too." },
  { emoji:"📷", cat:'Courage', diff:1, quest:"Ask a stranger to take your photo somewhere public.", flavour:"Tourists do it every day. It is a tiny ask with a clear ending and a souvenir." },
  { emoji:"🚫", cat:'Courage', diff:2, quest:"Say no to a small request today without over-explaining: \"I can't, but thanks for asking.\" Full stop.", flavour:"A short no is not rude. The long apology afterwards is the part you can drop." },
  { emoji:"🎶", cat:'Courage', diff:2, quest:"Sing along, out loud, to one whole song while you walk or cycle outside.", flavour:"You will feel ridiculous for about ten seconds. Then you will feel free." },
  { emoji:"🎭", cat:'Courage', diff:3, quest:"Take a beginners' class where everyone is new (improv, dance, pottery) and do every exercise fully, even the silly ones.", flavour:"Everyone in the room is as nervous as you are. Commit, and the awkwardness turns into laughter." },
  { emoji:"🥫", cat:'Courage', diff:2, quest:"Volunteer for a shift with other people: a food bank, a park clean-up, a charity race.", flavour:"A shared task takes the pressure off talking. Conversation happens sideways." },
  { emoji:"📝", cat:'Courage', diff:1, quest:"After a social event, write down three things that went fine before you let yourself replay anything that didn't.", flavour:"Anxiety only keeps the awkward bits. Give your memory a fairer edit." },
  { emoji:"📚", cat:'Courage', diff:2, quest:"Ask a stranger what they are reading, listening to or drawing.", flavour:"People like being asked about what they chose. You only need the first question." },
  { emoji:"🥂", cat:'Courage', diff:3, quest:"Say a few words or raise a short toast at the next dinner or gathering.", flavour:"Three sentences is a toast. Thank the host, say one true thing, raise your glass." },
  { emoji:"🧢", cat:'Courage', diff:1, quest:"Wear something a little bolder than usual, a bright colour or a hat, for a whole day.", flavour:"You will notice people noticing. Then you will notice how quickly they stop." },
  { emoji:"🗺️", cat:'Courage', diff:2, quest:"Ask a local for their favourite place nearby, then go there and tell them about it next time you see them.", flavour:"A recommendation is an easy opener, and coming back with a report turns it into a connection." },
];

var current = null;

function getQuest() {
  var q;
  do { q = QUESTS[Math.floor(Math.random() * QUESTS.length)]; } while (q === current);
  return q;
}

function renderQuest(q) {
  current = q;
  var card = document.getElementById('sq-card');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = '';

  document.getElementById('sq-emoji').textContent   = q.emoji;
  document.getElementById('sq-quest').textContent   = q.quest;
  document.getElementById('sq-flavour').textContent = q.flavour;
  document.getElementById('sq-category').textContent = q.cat;

  var dots = document.getElementById('sq-diff');
  dots.innerHTML = '';
  dots.parentElement.setAttribute('aria-label', 'Difficulty ' + q.diff + ' of 3');
  for (var i = 1; i <= 3; i++) {
    var s = document.createElement('span');
    if (i <= q.diff) s.classList.add('lit');
    dots.appendChild(s);
  }

  var em = document.getElementById('sq-emoji');
  em.style.animation = 'none';
  void em.offsetWidth;
  em.style.animation = '';
}

document.getElementById('sq-reroll').addEventListener('click', function() {
  renderQuest(getQuest());
});

renderQuest(getQuest());
</script>
</body>
</html>
