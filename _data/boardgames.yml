# The board game shelf at /board-games. One block per game.
#   title:    name of the game (required)
#   status:   own | played | wishlist (required: which shelf it stands on)
#   year:     year it came out
#   designer: who designed it
#   players:  e.g. "2–5"
#   plays:    how much I have played it, e.g. "a lot", "once"
#   rating:   my score out of 5 (leave empty until I have one)
#   review:   my review, a few sentences (leave empty until written)
#   size:     small | medium | large (how big the box looks on the shelf)
